name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # x.yy.zzz per component (versions.json, scripts/version.mjs): yy counts days with changes, zzz is this run.
  version:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.v.outputs.app }}
      homeassistant: ${{ steps.v.outputs.homeassistant }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          echo "app=$(node scripts/version.mjs app)" >> "$GITHUB_OUTPUT"
          echo "homeassistant=$(node scripts/version.mjs homeassistant)" >> "$GITHUB_OUTPUT"
      - run: |
          echo "App: ${{ steps.v.outputs.app }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Home Assistant: ${{ steps.v.outputs.homeassistant }}" >> "$GITHUB_STEP_SUMMARY"

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  homeassistant:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @shopping/server build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r ha-tests/requirements.txt
      - run: python -m pytest -q
        working-directory: ha-tests

  image:
    needs: [version, test, homeassistant]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ needs.version.outputs.app }}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ needs.version.outputs.app }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # HACS installs the integration from GitHub releases (shopping.zip with the version in the manifest).
  # A release only when the integration changed since the last one.
  homeassistant-release:
    needs: [version, homeassistant]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        run: |
          last=$(git tag --list 'v*' --sort=-creatordate | head -1)
          if [ -z "$last" ] || ! git diff --quiet "$last" HEAD -- custom_components hacs.json; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.homeassistant }}
        run: |
          cd custom_components/shopping
          jq --arg v "$VERSION" '.version = $v' manifest.json > manifest.tmp && mv manifest.tmp manifest.json
          rm -rf __pycache__
          zip -r ../../shopping.zip . -x '*.pyc'
          cd ../..
          gh release create "v$VERSION" shopping.zip --target "$GITHUB_SHA" --title "Home Assistant $VERSION" \
            --notes "Home-Assistant-Integration $VERSION (App-Version im selben Lauf: ${{ needs.version.outputs.app }})."
