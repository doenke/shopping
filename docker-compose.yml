# Beispiel für den Betrieb hinter einem Reverse Proxy (HTTPS ist Pflicht für die PWA).
services:
  app:
    image: ghcr.io/doenke/shopping:latest
    # build: .   # alternativ selbst bauen
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://shopping:${POSTGRES_PASSWORD}@db:5432/shopping
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shopping
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: shopping
    volumes:
      - ./pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopping"]
      interval: 5s
      retries: 10
